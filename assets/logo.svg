<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BazaarLink Auto-Creator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4f8cff"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8c7e6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <g opacity="0.10" stroke="#4f8cff" stroke-width="1">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280"/>
    <path d="M160 0 V400 M320 0 V400 M480 0 V400 M640 0 V400 M800 0 V400 M960 0 V400 M1120 0 V400"/>
  </g>

  <!-- emblem -->
  <g transform="translate(150 200)" filter="url(#glow)">
    <circle r="86" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.55"/>
    <circle r="66" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.35"/>
    <circle r="46" fill="url(#orb)"/>
    <path d="M-20 4 L-4 20 L22 -14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="66" cy="-66" r="9" fill="#22d3ee"/>
    <circle cx="-70" cy="52" r="7" fill="#a855f7"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(300 0)">
    <text x="0" y="176" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" fill="url(#txt)" letter-spacing="-1">BazaarLink</text>
    <text x="0" y="234" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#7f93b8" letter-spacing="3">AUTO-CREATOR</text>
    <text x="0" y="292" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="21" fill="#5f7699">fresh inbox  →  verified account  →  api key</text>
  </g>
</svg>
